name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: python -m pip install -r api/requirements-dev.txt

      - name: Run API tests
        run: python -m pytest api/tests analysis/tests

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fraud-dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --prefix fraud-dashboard

      - name: Build dashboard
        run: npm run build --prefix fraud-dashboard
