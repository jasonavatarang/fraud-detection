services:
  db:
    image: postgres:16
    container_name: fraud-db
    environment:
      POSTGRES_DB: frauddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frauddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.2.0
    container_name: fraud-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"

  spark-stream-job:
    image: python:3.11-slim
    container_name: fraud-spark-stream
    working_dir: /app
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: frauddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_TOPIC: fraud-events
    volumes:
      - ./processing:/app/processing
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    command: >
      bash -c "sleep 15 &&
               apt-get update &&
               apt-get install -y bash default-jdk wget procps &&
               pip install --no-cache-dir -r processing/requirements.txt &&
               python processing/spark_stream_job.py"

  producer:
    image: python:3.11-slim
    container_name: fraud-producer
    working_dir: /app
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_TOPIC: fraud-events
      FRAUD_BURST_PROBABILITY: "0.2"
      SEND_MIN_SECONDS: "1"
      SEND_MAX_SECONDS: "3"
    volumes:
      - ./producer:/app/producer
    depends_on:
      - kafka
    command: >
      bash -c "sleep 20 &&
               pip install --no-cache-dir -r producer/requirements.txt &&
               python producer/send_events.py"

  demo-replay:
    image: python:3.11-slim
    container_name: fraud-demo-replay
    working_dir: /app
    profiles:
      - demo
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_TOPIC: fraud-events
    volumes:
      - ./producer:/app/producer
      - ./data:/app/data
    depends_on:
      kafka:
        condition: service_started
    command: >
      bash -c "sleep 10 &&
               pip install --no-cache-dir -r producer/requirements.txt &&
               python producer/replay_events.py --file data/demo_events.csv --bootstrap-servers kafka:9093 --delay-seconds 0.5"

  redis:
    image: redis:7
    container_name: fraud-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.11-slim
    container_name: fraud-api
    working_dir: /app
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: frauddb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DASHBOARD_ORIGINS: http://localhost:5173
    volumes:
      - ./api:/app/api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: >
      bash -c "pip install --no-cache-dir -r api/requirements.txt &&
               uvicorn api.main:app --host 0.0.0.0 --port 8000"
